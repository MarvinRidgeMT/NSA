          required:
            - lat_deg
            - lon_deg_east
            - observer_mast_m
          properties:
            id:
              type:
                - string
                - "null"
            name:
              type:
                - string
                - "null"
            lat_deg:
              type: number
            lon_deg_east:
              type: number
            height_m:
              type:
                - number
                - "null"
            observer_mast_m:
              type: number
        window:
          type: object
        members:
          type: array
          items:
            type: string
        metrics:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/Number"
        uncertainty:
          type:
            - object
            - "null"
        solver_version:
          type:
            - string
            - "null"
        terrain:
          type:
            - object
            - "null"
          description: any-site terrain used (null for world bundles)
          properties:
            near_product:
              type:
                - string
                - "null"
            far_product:
