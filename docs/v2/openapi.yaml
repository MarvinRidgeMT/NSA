components:
  schemas:
    Error:
      type: object
      required:
        - error
        - status
      additionalProperties: true
      properties:
        error:
          type: string
        status:
          type: integer
        detail:
          type:
            - string
            - "null"
    SolveRequest:
      type: object
      additionalProperties: false
      required:
        - lat
        - lon
      properties:
        world:
          type: string
          enum:
            - moon
            - mercury
            - mars
          default: moon
          description: "Context selector (not a scenario axis). Mercury: precomputed Prokofiev rim only; Mars: not available."
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: planetocentric latitude, deg
        lon:
          type: number
          minimum: -360
          maximum: 360
          description: east longitude, deg
        mast_m:
          type: number
          minimum: 0
          maximum: 1000
          default: 1.0
          description: observer height above the local terrain, m
        start:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$"
          default: "2026-11-14 00:00"
          description: UTC window start
        days:
          type: integer
          minimum: 1
          maximum: 400
          description: window length (Moon default 14)
        step_h:
          type: integer
          minimum: 1
          maximum: 24
          default: 1
        members:
          type: array
          items:
            type: string
            enum:
              - clones
              - assumed
              - products
          uniqueItems: true
          description: "uncertainty members. Omitted: use whatever member set was precomputed at this point; when computing, all three."
        n_members:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        compute:
          type: boolean
          default: false
          description: "false: cache/precompute lookup only (404 if absent). true: run the any-site solver (needs the local terrain pyramid; seconds to a minute)."
        allow_network:
          type: boolean
          default: false
          description: allow JPL Horizons requests when computing (raw responses are cached)
        full:
          type: boolean
          default: false
          description: return the whole results bundle
    SolveResult:
      type: object
      additionalProperties: true
      required:
        - world
        - site_hash
        - label
        - cache
        - metrics
        - site
        - links
        - reproduce
        - disclaimer
      properties:
        world:
          type: string
          enum:
            - moon
            - mercury
            - mars
        site_hash:
          type: string
          pattern: "^[0-9a-f]{16}$"
        label:
          type: string
        disclaimer:
